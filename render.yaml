services:
  - type: web
    name: domino-lan-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22

  - type: web
    name: domino-lan-web
    runtime: static
    rootDir: web
    buildCommand: echo "Publishing Domino PWA"
    staticPublishPath: .
