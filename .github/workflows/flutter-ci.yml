name: Flutter Android and iOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android checks and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.domino.lan .

      - name: Configure local network permissions
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          required = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
          ]
          existing = {
              node.get(android + "name")
              for node in root.findall("uses-permission")
          }
          for permission in required:
              if permission not in existing:
                  node = ET.Element("uses-permission")
                  node.set(android + "name", permission)
                  root.insert(0, node)

          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          application.set(android + "usesCleartextTraffic", "true")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: domino-lan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS platform
        run: flutter create --platforms=ios --org com.domino.lan .

      - name: Configure iOS local network privacy
        shell: python
        run: |
          import plistlib
          from pathlib import Path

          path = Path("ios/Runner/Info.plist")
          with path.open("rb") as source:
              info = plistlib.load(source)

          info["NSLocalNetworkUsageDescription"] = (
              "تحتاج لعبة دومينو الشبكة إلى الوصول إلى الشبكة المحلية "
              "لإنشاء الغرف والعثور على اللاعبين والاتصال بهم عبر Wi-Fi أو نقطة الاتصال."
          )
          transport = info.setdefault("NSAppTransportSecurity", {})
          transport["NSAllowsLocalNetworking"] = True

          with path.open("wb") as target:
              plistlib.dump(info, target, fmt=plistlib.FMT_XML, sort_keys=False)

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: domino-lan-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
